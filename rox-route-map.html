<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROX Motor — Ivory Coast Route Map</title>

  <!-- OG / sharing -->
  <meta property="og:title"       content="ROX Motor — Ivory Coast | 6-Day Campaign Route" />
  <meta property="og:description" content="Interactive operational itinerary: Noé → Assinie → Abidjan → Yamoussoukro → Korhogo → Guinea. Atoure Management & Consulting." />
  <meta property="og:type"        content="website" />
  <meta property="og:image"       content="https://raw.githubusercontent.com/atoureconsulting/ROX/claude/rox-motor-route-map-PobVw/Media/Yakro/basilique-Notre-Dame-de-la-Paix-de-Yamoussoukro-2.jpg" />
  <meta name="twitter:card"       content="summary_large_image" />

  <!-- Inline SVG favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230D0C0A'/><circle cx='16' cy='16' r='10' fill='none' stroke='%23C8A951' stroke-width='2.5'/><circle cx='16' cy='16' r='4' fill='%23C8A951'/></svg>" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #C8A951;
      --dark:    #0D0C0A;
      --surface: #1A1814;
      --cream:   #FAF6EE;
      --mid:     #5C5040;
      --light:   #9A8870;
      --coral:   #C4604A;
      --teal:    #1A5C52;
      --navy:    #1A2A5C;
      --amber:   #B8822A;
    }

    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--cream);
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── HEADER ──────────────────────────────────────────────────────── */
    .header {
      background: var(--dark);
      border-bottom: 1px solid rgba(200,169,81,0.22);
      padding: 18px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .header-brand h1 {
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      font-weight: normal;
      color: var(--gold);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .header-meta span {
      font-size: 0.65rem;
      color: var(--light);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: system-ui, sans-serif;
    }

    .header-meta span + span::before {
      content: '·';
      margin-right: 14px;
      color: var(--mid);
    }

    .toggle-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .itin-btn {
      padding: 7px 15px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-size: 0.7rem;
      letter-spacing: 0.09em;
      cursor: pointer;
      transition: background 0.22s, color 0.22s;
      font-family: system-ui, sans-serif;
      white-space: nowrap;
      border-radius: 1px;
    }

    .itin-btn.active {
      background: var(--gold);
      color: var(--dark);
      font-weight: 600;
    }

    .itin-btn:hover:not(.active) { background: rgba(200,169,81,0.1); }

    /* ── MAP ─────────────────────────────────────────────────────────── */
    #map { width: 100%; height: 480px; }

    .leaflet-control-zoom a {
      background: var(--surface) !important;
      color: var(--gold) !important;
      border-color: rgba(200,169,81,0.25) !important;
    }
    .leaflet-control-zoom a:hover { background: #252018 !important; }
    .leaflet-bar { border: 1px solid rgba(200,169,81,0.25) !important; box-shadow: none !important; }
    .leaflet-control-attribution {
      background: rgba(13,12,10,0.78) !important;
      color: var(--mid) !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: var(--light) !important; }

    /* ── STOP MARKERS ─────────────────────────────────────────────────── */
    .stop-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--dark);
      border: 2.5px solid var(--gold);
      box-shadow: 0 0 0 3px rgba(200,169,81,0.14), 0 2px 10px rgba(0,0,0,0.6);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .stop-dot.is-active {
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(200,169,81,0.28), 0 2px 14px rgba(0,0,0,0.75);
      transform: scale(1.35);
    }

    /* ── POPUPS ──────────────────────────────────────────────────────── */
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid rgba(200,169,81,0.38) !important;
      border-radius: 3px !important;
      box-shadow: 0 6px 28px rgba(0,0,0,0.68) !important;
      padding: 0 !important;
    }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .leaflet-popup-close-button {
      color: var(--light) !important;
      padding: 8px 10px !important;
      font-size: 14px !important;
      top: 0 !important; right: 0 !important;
    }
    .leaflet-popup-close-button:hover { color: var(--gold) !important; background: transparent !important; }

    .popup-body { padding: 12px 16px 14px; min-width: 190px; max-width: 240px; }
    .popup-sub {
      font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold); font-family: system-ui, sans-serif; margin-bottom: 3px;
    }
    .popup-name { font-size: 1rem; color: var(--cream); margin-bottom: 5px; padding-right: 16px; }
    .popup-hotel {
      font-size: 0.68rem; color: var(--gold); font-family: system-ui, sans-serif;
      margin-bottom: 5px; opacity: 0.8;
    }
    .popup-desc { font-size: 0.72rem; color: var(--light); line-height: 1.55; font-family: system-ui, sans-serif; }

    /* ── MAP TOGGLE ──────────────────────────────────────────────────── */
    .map-toggle-bar {
      background: var(--dark);
      border-bottom: 1px solid rgba(200,169,81,0.1);
      padding: 6px 26px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .map-toggle-btn {
      background: none;
      border: 1px solid rgba(200,169,81,0.25);
      color: var(--light);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: system-ui, sans-serif;
      padding: 4px 11px;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.18s, border-color 0.18s;
    }
    .map-toggle-btn:hover { color: var(--gold); border-color: rgba(200,169,81,0.5); }
    #map { transition: height 0.3s ease; }
    #map.map-hidden { height: 0 !important; overflow: hidden; }

    /* ── CARDS ───────────────────────────────────────────────────────── */
    .cards-section {
      background: var(--dark);
      border-top: 1px solid rgba(200,169,81,0.12);
      padding: 16px 26px 0;
    }

    .cards-track {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px;
      scrollbar-width: thin; scrollbar-color: var(--mid) transparent;
    }
    .cards-track::-webkit-scrollbar { height: 3px; }
    .cards-track::-webkit-scrollbar-thumb { background: var(--mid); border-radius: 2px; }

    .day-card {
      flex: 0 0 auto;
      min-width: 154px;
      background: var(--surface);
      border-top: 3px solid currentColor;
      padding: 11px 13px 13px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      border-radius: 0 0 3px 3px;
      outline: none;
      user-select: none;
    }
    .day-card:hover { background: #21201a; }
    .day-card.active {
      background: #21201a;
      box-shadow: inset 0 0 0 1px rgba(200,169,81,0.18);
    }
    .card-lbl {
      font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--light); font-family: system-ui, sans-serif; margin-bottom: 5px;
      transition: color 0.2s;
    }
    .day-card.active .card-lbl { color: var(--gold); }
    .card-title { font-size: 0.78rem; color: var(--cream); line-height: 1.38; }
    .card-dist { font-size: 0.66rem; color: var(--mid); font-family: system-ui, sans-serif; margin-top: 6px; }

    /* ── DETAIL PANEL ────────────────────────────────────────────────── */
    .detail-panel { background: var(--dark); padding: 20px 26px 32px; }
    .detail-inner { max-width: 1100px; margin: 0 auto; }

    /* fade-in on day switch */
    .detail-inner { animation: fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .detail-head {
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(200,169,81,0.13);
    }
    .detail-head-row {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .detail-head h2 {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: normal;
      color: var(--gold);
      letter-spacing: 0.05em;
      line-height: 1.3;
    }
    .detail-meta {
      font-size: 0.68rem; color: var(--light); font-family: system-ui, sans-serif;
      letter-spacing: 0.09em; text-transform: uppercase; margin-top: 4px;
    }
    .day-progress {
      font-size: 0.62rem; color: var(--mid); font-family: system-ui, sans-serif;
      letter-spacing: 0.1em; white-space: nowrap; padding-top: 3px; flex-shrink: 0;
    }

    /* ── PREV / NEXT NAV ─────────────────────────────────────────────── */
    .day-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 28px; padding-top: 18px;
      border-top: 1px solid rgba(200,169,81,0.1);
    }
    .day-nav-btn {
      background: none;
      border: 1px solid rgba(200,169,81,0.25);
      color: var(--light);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      font-family: system-ui, sans-serif;
      padding: 7px 16px;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.18s, border-color 0.18s, background 0.18s;
    }
    .day-nav-btn:hover { color: var(--gold); border-color: rgba(200,169,81,0.5); background: rgba(200,169,81,0.04); }
    .day-nav-btn:disabled { opacity: 0.22; cursor: default; }
    .day-nav-btn:disabled:hover { color: var(--light); border-color: rgba(200,169,81,0.25); background: none; }
    .day-nav-center { font-size: 0.62rem; color: var(--mid); font-family: system-ui, sans-serif; letter-spacing: 0.1em; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .d-cell { background: var(--surface); padding: 12px 14px; border-radius: 3px; }
    .d-cell.span2 { grid-column: 1 / -1; }

    .d-label {
      font-size: 0.57rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gold); font-family: system-ui, sans-serif; margin-bottom: 6px;
    }
    .d-value {
      font-size: 0.77rem; color: var(--cream); line-height: 1.6; font-family: system-ui, sans-serif;
    }

    /* hotel TBC badge */
    .tbc-badge {
      display: inline-block;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(184,130,42,0.15);
      color: var(--amber);
      border: 1px solid rgba(184,130,42,0.35);
      padding: 1px 5px;
      border-radius: 2px;
      margin-left: 6px;
      vertical-align: middle;
      font-family: system-ui, sans-serif;
    }
    .confirmed-badge {
      display: inline-block;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(26,92,82,0.2);
      color: #4aaa8e;
      border: 1px solid rgba(74,170,142,0.3);
      padding: 1px 5px;
      border-radius: 2px;
      margin-left: 6px;
      vertical-align: middle;
      font-family: system-ui, sans-serif;
    }

    /* watch points list */
    .watch-list { list-style: none; padding: 0; margin: 0; }
    .watch-list li {
      position: relative;
      padding-left: 14px;
      margin-bottom: 5px;
      font-size: 0.75rem;
      color: var(--cream);
      line-height: 1.5;
      font-family: system-ui, sans-serif;
    }
    .watch-list li:last-child { margin-bottom: 0; }
    .watch-list li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--coral);
      font-weight: bold;
    }

    /* vision bar */
    .vision-block {
      border-left: 3px solid var(--coral);
      background: rgba(196,96,74,0.06);
      padding: 12px 16px;
      border-radius: 0 3px 3px 0;
      margin-bottom: 14px;
    }
    .vision-lbl {
      font-size: 0.57rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--coral); font-family: system-ui, sans-serif; margin-bottom: 6px;
      display: flex; align-items: center; gap: 7px;
    }
    .vision-lbl::before { content: '◈'; font-size: 0.65rem; }
    .vision-txt { font-size: 0.8rem; color: var(--cream); line-height: 1.65; }

    /* note bar */
    .note-block {
      border-left: 3px solid var(--gold);
      background: rgba(200,169,81,0.042);
      padding: 10px 14px;
      border-radius: 0 3px 3px 0;
    }
    .note-lbl {
      font-size: 0.57rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gold); font-family: system-ui, sans-serif; margin-bottom: 5px;
    }
    .note-txt { font-size: 0.77rem; color: var(--light); line-height: 1.55; font-style: italic; }

    /* ── LOGO ────────────────────────────────────────────────────────── */
    .atoure-logo {
      height: 64px;
      width: auto;
      object-fit: contain;
      opacity: 0.95;
      display: block;
      margin-bottom: 8px;
    }

    /* ── MEDIA HERO GALLERY ──────────────────────────────────────────── */
    .media-section-lbl {
      font-size: 0.57rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      font-family: system-ui, sans-serif;
      margin-bottom: 9px;
    }

    .media-hero { margin-bottom: 24px; }

    .media-hero-main {
      width: 100%;
      height: 420px;
      border-radius: 4px;
      overflow: hidden;
      cursor: zoom-in;
      position: relative;
      background: #111;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-hero-main img,
    .media-hero-main video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      transition: opacity 0.22s;
    }
    .media-hero-main::after {
      content: '⤢';
      position: absolute;
      bottom: 9px; right: 9px;
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.42);
      padding: 2px 6px;
      border-radius: 3px;
      pointer-events: none;
      line-height: 1.4;
    }

    .hero-thumbs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--mid) transparent;
    }
    .hero-thumbs::-webkit-scrollbar { height: 3px; }
    .hero-thumbs::-webkit-scrollbar-thumb { background: var(--mid); border-radius: 2px; }

    .hero-thumb {
      flex: 0 0 auto;
      width: 72px;
      height: 48px;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.55;
      transition: border-color 0.18s, opacity 0.18s;
      background: var(--surface);
    }
    .hero-thumb.active, .hero-thumb:hover { border-color: var(--gold); opacity: 1; }
    .hero-thumb img, .hero-thumb video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .play-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.38);
      font-size: 22px;
      color: rgba(255,255,255,0.9);
      pointer-events: none;
    }

    @media (max-width: 620px) {
      .media-hero-main { height: 260px; }
    }

    /* ── LIGHTBOX ─────────────────────────────────────────────────────── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 9000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }

    .lb-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 9001;
    }
    .lb-counter {
      font-size: 0.72rem;
      color: var(--light);
      font-family: system-ui, sans-serif;
      letter-spacing: 0.1em;
    }
    .lb-close {
      background: none;
      border: none;
      color: var(--light);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.15s;
      line-height: 1;
    }
    .lb-close:hover { color: var(--gold); }

    .lb-stage {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 96vw;
      max-height: 88vh;
    }

    .lb-arrow {
      background: none;
      border: 1px solid rgba(200,169,81,0.3);
      color: var(--gold);
      font-size: 32px;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-arrow:hover { background: rgba(200,169,81,0.12); border-color: var(--gold); }
    .lb-arrow:disabled { opacity: 0.2; cursor: default; }

    #lb-content img,
    #lb-content video {
      max-width: min(82vw, 1100px);
      max-height: 80vh;
      object-fit: contain;
      border-radius: 3px;
      display: block;
    }

    /* ── RESPONSIVE ──────────────────────────────────────────────────── */
    @media (max-width: 740px) {
      .detail-grid { grid-template-columns: 1fr; }
      .d-cell.span2 { grid-column: 1; }
    }
    @media (max-width: 620px) {
      .header { flex-direction: column; align-items: flex-start; }
      #map { height: 280px; }
      .cards-section, .detail-panel, .header, .map-toggle-bar { padding-left: 14px; padding-right: 14px; }
      .lb-arrow { display: none; }
      .day-nav-btn { padding: 6px 11px; font-size: 0.63rem; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────── -->
<header class="header">
  <div class="header-brand">
    <img src="https://raw.githubusercontent.com/atoureconsulting/ROX/claude/rox-motor-route-map-PobVw/Media/logos/1.png"
         class="atoure-logo" alt="Atoure Management & Consulting" />
    <h1 id="hdr-title">ROX Motor — Ivory Coast</h1>
    <div class="header-meta">
      <span id="hdr-sub1">6-Day Campaign Route</span>
      <span>2 ROX + 4 Support 4×4s</span>
      <span>~25 Crew</span>
    </div>
  </div>
  <div class="toggle-group">
    <button class="itin-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="itin-btn"        id="btn-fr" onclick="setLang('fr')">FR</button>
  </div>
</header>

<!-- ── MAP ─────────────────────────────────────────────────────────────── -->
<div id="map"></div>
<div class="map-toggle-bar">
  <button class="map-toggle-btn" id="map-toggle-btn" onclick="toggleMap()">Hide Map</button>
</div>

<!-- ── CARDS ───────────────────────────────────────────────────────────── -->
<div class="cards-section">
  <div class="cards-track" id="cards-track"></div>
</div>

<!-- ── DETAIL ──────────────────────────────────────────────────────────── -->
<div class="detail-panel" id="detail-panel"></div>


<!-- ── LIGHTBOX ────────────────────────────────────────────────────────── -->
<div id="lightbox" class="lightbox">
  <div class="lb-top">
    <span id="lb-counter" class="lb-counter"></span>
    <button class="lb-close" id="lb-close">✕</button>
  </div>
  <div class="lb-stage">
    <button class="lb-arrow" id="lb-prev">&#8249;</button>
    <div id="lb-content"></div>
    <button class="lb-arrow" id="lb-next">&#8250;</button>
  </div>
</div>

<script>
/* ── DATA ──────────────────────────────────────────────────────────────── */

const STOPS = [
  {
    ll: [5.11, -2.97], label: 'Noé border', labelFr: 'Frontière de Noé', sub: 'Entry', subFr: 'Entrée',
    hotel: null,
    desc:   'Ghana–Ivory Coast border crossing. Gateway to the 6-day campaign route. Allow 1–2h for formalities.',
    descFr: 'Passage frontalier Ghana–Côte d\'Ivoire. Porte d\'entrée du parcours 6 jours. Prévoir 1–2h pour les formalités.'
  },
  {
    ll: [5.15, -3.18], label: 'Assinie', labelFr: 'Assinie', sub: 'Day 1', subFr: 'Jour 1',
    hotel: "L'Escapade Hotel — Assinie Km 12",
    desc:   'Lagoon resort destination. Sunset vehicle reveal. Pier shot — drone ascending from water level to reveal the Atlantic peninsula.',
    descFr: 'Destination balnéaire lagunaire. Révélation du véhicule au coucher du soleil. Plan de la jetée — drone en ascension depuis le niveau de l\'eau révélant la péninsule atlantique.'

/* ── STATE ──────────────────────────────────────────────────────────────── */
let lang      = 'en';
let activeDay = 0;

/* ── MAP INIT ───────────────────────────────────────────────────────────── */
const map = L.map('map', { center: [7.0, -5.5], zoom: 7 });

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

/* ── MARKER FACTORY ─────────────────────────────────────────────────────── */
function makeStopIcon(active) {
  return L.divIcon({
    className: '',
    html: `<div class="stop-dot${active ? ' is-active' : ''}"></div>`,
    iconSize:    [16, 16],
    iconAnchor:  [8, 8],
    popupAnchor: [0, -11]
  });
}

/* ── STOP MARKERS ───────────────────────────────────────────────────────── */
function popupHtml(s) {
  const fr = lang === 'fr';
  const hotelLine = s.hotel ? `<div class="popup-hotel">${s.hotel}</div>` : '';
  return `<div class="popup-body">
    <div class="popup-sub">${fr && s.subFr ? s.subFr : s.sub}</div>
    <div class="popup-name">${fr && s.labelFr ? s.labelFr : s.label}</div>
    ${hotelLine}
    <div class="popup-desc">${fr && s.descFr ? s.descFr : s.desc}</div>
  </div>`;
}

const markers = STOPS.map(s => {
  const m = L.marker(s.ll, { icon: makeStopIcon(false), zIndexOffset: 500 });
  m.bindPopup(popupHtml(s), { maxWidth: 260, minWidth: 200 });
  m.addTo(map);
  return m;
});

function rebuildPopups() {
  STOPS.forEach((s, i) => markers[i].bindPopup(popupHtml(s), { maxWidth: 260, minWidth: 200 }));
}

/* ── BUILD CARDS ────────────────────────────────────────────────────────── */
const track = document.getElementById('cards-track');

function buildCards() {
  const src = lang === 'fr' ? DAYS_FR : DAYS;
  track.innerHTML = '';
  src.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'day-card' + (i === activeDay ? ' active' : '');
    card.style.color = d.borderColor;
    card.setAttribute('tabindex', '0');
    card.innerHTML = `
      <div class="card-lbl">${d.label}</div>
      <div class="card-title">${d.route}</div>
      <div class="card-dist">${d.distance}</div>
    `;
    card.addEventListener('click', () => selectDay(i));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectDay(i); }
    });
    track.appendChild(card);
  });
}
buildCards();

/* ── RENDER DETAIL PANEL ────────────────────────────────────────────────── */
const UI = {
  en: { convoy:'Convoy', hotel:'Hotel', activation:'Activation', watch:'Watch Points', note:'Priority Note',
        confirmed:'Confirmed', tbc:'TBC', delegation:'Delegation Option', vision:'Atoure Vision' },
  fr: { convoy:'Convoi', hotel:'Hôtel', activation:'Activation', watch:'Points de Vigilance',
        note:'Note Prioritaire', confirmed:'Confirmé', tbc:'À CONFIRMER', delegation:'Option Délégation',
        vision:'Vision Atoure' }
};

function hotelBadge(status) {
  const u = UI[lang];
  if (status === 'confirmed') return `<span class="confirmed-badge">${u.confirmed}</span>`;
  if (status === 'tbc')       return `<span class="tbc-badge">${u.tbc}</span>`;
  return '';
}

function renderDetail() {
  const d = (lang === 'fr' ? DAYS_FR : DAYS)[activeDay];
  const u = UI[lang];
  const watchItems = d.watchPoints.map(w => `<li>${w}</li>`).join('');

  const total = DAYS.length;
  const prevLabel = activeDay > 0 ? (lang === 'fr' ? DAYS_FR : DAYS)[activeDay - 1].label : '';
  const nextLabel = activeDay < total - 1 ? (lang === 'fr' ? DAYS_FR : DAYS)[activeDay + 1].label : '';

  document.getElementById('detail-panel').innerHTML = `<div class="detail-inner">
    <div class="detail-head">
      <div class="detail-head-row">
        <div>
          <h2>${d.label} — ${d.route}</h2>
          <div class="detail-meta">${d.distance}</div>
        </div>
        <div class="day-progress">${activeDay + 1} / ${total}</div>
      </div>
    </div>
    ${buildMediaHero(activeDay)}
    <div class="detail-grid">
      <div class="d-cell">
        <div class="d-label">${u.convoy}</div>
        <div class="d-value">${d.convoy}</div>
      </div>
      <div class="d-cell">
        <div class="d-label">${u.delegation}</div>
        <div class="d-value">${d.spB}</div>
      </div>
      <div class="d-cell">
        <div class="d-label">${u.hotel} ${hotelBadge(d.hotelStatus)}</div>
        <div class="d-value">${d.hotel}</div>
      </div>
      <div class="d-cell">
        <div class="d-label">${u.activation}</div>
        <div class="d-value">${d.activation}</div>
      </div>
      <div class="d-cell span2">
        <div class="d-label">${u.watch}</div>
        <div class="d-value"><ul class="watch-list">${watchItems}</ul></div>
      </div>
    </div>
    ${d.vision ? `<div class="vision-block">
      <div class="vision-lbl">${u.vision}</div>
      <div class="vision-txt">${d.vision}</div>
    </div>` : ''}
    <div class="note-block">
      <div class="note-lbl">${u.note}</div>
      <div class="note-txt">${d.note}</div>
    </div>
    <div class="day-nav">
      <button class="day-nav-btn" onclick="selectDay(${activeDay - 1})" ${activeDay === 0 ? 'disabled' : ''}>
        ← ${prevLabel}
      </button>
      <span class="day-nav-center">${activeDay + 1} / ${total}</span>
      <button class="day-nav-btn" onclick="selectDay(${activeDay + 1})" ${activeDay === total - 1 ? 'disabled' : ''}>
        ${nextLabel} →
      </button>
    </div>
  </div>`;
}

/* ── SELECT DAY ─────────────────────────────────────────────────────────── */
function selectDay(i) {
  activeDay = i;

  const cards = document.querySelectorAll('.day-card');
  cards.forEach((c, ci) => c.classList.toggle('active', ci === i));
  if (cards[i]) cards[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  markers.forEach((m, mi) => m.setIcon(makeStopIcon(mi === DAYS[i].focusStop)));

  const stop = STOPS[DAYS[i].focusStop];
  if (!document.getElementById('map').classList.contains('map-hidden')) {
    map.flyTo(stop.ll, DAYS[i].zoom, { duration: 1.1 });
    setTimeout(() => markers[DAYS[i].focusStop].openPopup(), 950);
  }

  renderDetail();
  document.getElementById('detail-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── MAP TOGGLE ─────────────────────────────────────────────────────────── */
function toggleMap() {
  const mapEl = document.getElementById('map');
  const btn   = document.getElementById('map-toggle-btn');
  const hidden = mapEl.classList.toggle('map-hidden');
  btn.textContent = hidden ? (lang === 'fr' ? 'Afficher la carte' : 'Show Map') : (lang === 'fr' ? 'Masquer la carte' : 'Hide Map');
  if (!hidden) setTimeout(() => map.invalidateSize(), 310);
}

/* ── LANGUAGE TOGGLE ────────────────────────────────────────────────────── */
function setLang(l) {
  lang = l;
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
  document.getElementById('hdr-title').textContent = l === 'fr' ? 'ROX Motor — Côte d\'Ivoire' : 'ROX Motor — Ivory Coast';
  document.getElementById('hdr-sub1').textContent  = l === 'fr' ? 'Itinéraire 6 Jours' : '6-Day Campaign Route';
  document.getElementById('map-toggle-btn').textContent = document.getElementById('map').classList.contains('map-hidden')
    ? (l === 'fr' ? 'Afficher la carte' : 'Show Map')
    : (l === 'fr' ? 'Masquer la carte' : 'Hide Map');
  rebuildPopups();
  buildCards();
  renderDetail();
}

/* ── MEDIA HERO GALLERY ─────────────────────────────────────────────────── */

function buildMediaHero(dayIdx) {
  const items = MEDIA[dayIdx];
  const lbl = lang === 'fr' ? 'Référence Visuelle' : 'Visual Reference';
  const dayLbl = (lang === 'fr' ? DAYS_FR : DAYS)[dayIdx].label;
  if (!items || items.length === 0) {
    const msg = lang === 'fr' ? 'Référence visuelle à venir' : 'Visual reference coming soon';
    return `<div class="media-hero"><div class="media-section-lbl">${lbl} — ${dayLbl}</div>
      <div style="height:80px;display:flex;align-items:center;justify-content:center;color:var(--mid);font-family:system-ui,sans-serif;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;border:1px dashed rgba(200,169,81,0.15);border-radius:4px;">${msg}</div>
    </div>`;
  }

  const first = items[0];
  const heroInner = first.type === 'video'
    ? `<video src="${first.src}" muted preload="metadata"></video><div class="play-badge">&#9654;</div>`
    : `<img src="${first.src}" alt="" />`;

  const thumbsHtml = items.length > 1 ? items.map((item, i) => {
    const inner = item.type === 'video'
      ? `<video src="${item.src}" muted preload="metadata"></video>`
      : `<img src="${item.src}" loading="lazy" alt="" />`;
    return `<div class="hero-thumb${i===0?' active':''}" onclick="setHeroImg(${dayIdx},${i})">${inner}</div>`;
  }).join('') : '';

  return `<div class="media-hero">
    <div class="media-section-lbl">${lbl} — ${dayLbl}</div>
    <div class="media-hero-main" id="hero-main" onclick="openLb(${dayIdx},0)">${heroInner}</div>
    ${items.length > 1 ? `<div class="hero-thumbs">${thumbsHtml}</div>` : ''}
  </div>`;
}

function setHeroImg(dayIdx, itemIdx) {
  const item   = MEDIA[dayIdx][itemIdx];
  const mainEl = document.getElementById('hero-main');
  if (!mainEl) return;
  mainEl.innerHTML = item.type === 'video'
    ? `<video src="${item.src}" muted preload="metadata"></video><div class="play-badge">&#9654;</div>`
    : `<img src="${item.src}" alt="" />`;
  mainEl.onclick = () => openLb(dayIdx, itemIdx);
  document.querySelectorAll('.hero-thumb').forEach((t, i) => t.classList.toggle('active', i === itemIdx));
}

/* ── LIGHTBOX ────────────────────────────────────────────────────────────── */

let lbItems = [];
let lbIdx   = 0;

function openLb(dayIdx, startIdx) {
  lbItems = MEDIA[dayIdx];
  lbIdx   = startIdx;
  showLbItem();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLb() {
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.body.style.overflow = '';
  const vid = document.querySelector('#lb-content video');
  if (vid) vid.pause();
}

function showLbItem() {
  const item    = lbItems[lbIdx];
  const content = document.getElementById('lb-content');
  const prev    = document.getElementById('lb-prev');
  const next    = document.getElementById('lb-next');
  const counter = document.getElementById('lb-counter');

  const vid = content.querySelector('video');
  if (vid) vid.pause();

  if (item.type === 'video') {
    content.innerHTML = `<video src="${item.src}" controls autoplay playsinline></video>`;
  } else {
    content.innerHTML = `<img src="${item.src}" alt="" />`;
  }

  const multi = lbItems.length > 1;
  prev.style.visibility = multi ? 'visible' : 'hidden';
  next.style.visibility = multi ? 'visible' : 'hidden';
  counter.textContent   = multi ? `${lbIdx + 1} / ${lbItems.length}` : '';
}

function prevLb(e) {
  e && e.stopPropagation();
  lbIdx = (lbIdx - 1 + lbItems.length) % lbItems.length;
  showLbItem();
}

function nextLb(e) {
  e && e.stopPropagation();
  lbIdx = (lbIdx + 1) % lbItems.length;
  showLbItem();
}

// Wire up lightbox controls once DOM is ready
document.getElementById('lb-close').addEventListener('click', closeLb);
document.getElementById('lb-prev').addEventListener('click', e => prevLb(e));
document.getElementById('lb-next').addEventListener('click', e => nextLb(e));
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLb();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape')     closeLb();
  if (e.key === 'ArrowLeft')  prevLb(null);
  if (e.key === 'ArrowRight') nextLb(null);
});

/* ── INIT ───────────────────────────────────────────────────────────────── */
markers[DAYS[0].focusStop].setIcon(makeStopIcon(true));
renderDetail();
setTimeout(() => markers[DAYS[0].focusStop].openPopup(), 750);
</script>
